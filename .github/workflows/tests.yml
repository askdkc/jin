name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm i

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Type Analysis
        run: composer types:check

      - name: Tests
        run: php artisan test

  onlyoffice:
    needs: ci
    runs-on: ubuntu-latest
    env:
      ONLYOFFICE_ENABLED: 'true'
      ONLYOFFICE_DOCUMENT_SERVER_URL: http://127.0.0.1:8081
      ONLYOFFICE_PUBLIC_URL: http://127.0.0.1:8081
      APP_ONLYOFFICE_INTERNAL_URL: http://app.internal.test
      ONLYOFFICE_JWT_SECRET: ci-onlyoffice-secret-not-for-production
    services:
      onlyoffice:
        image: onlyoffice/documentserver:9.4.0.1
        env:
          JWT_ENABLED: 'true'
          JWT_SECRET: ci-onlyoffice-secret-not-for-production
          PLUGINS_ENABLED: 'false'
        ports:
          - 8081:80
        options: --shm-size=2g

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Configure Application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Wait for ONLYOFFICE
        run: |
          for attempt in {1..120}; do
            if curl -fsS --connect-timeout 2 --max-time 3 \
              http://127.0.0.1:8081/healthcheck 2>/dev/null |
              tr -d '[:space:]' |
              grep -Eiq '^(true|ok)$'; then
              curl -fsS --connect-timeout 2 --max-time 10 \
                http://127.0.0.1:8081/web-apps/apps/api/documents/api.js >/dev/null
              exit 0
            fi
            sleep 2
          done

          echo 'ONLYOFFICE did not become ready within 240 seconds.' >&2
          exit 1

      - name: Run ONLYOFFICE Integration Test
        run: php artisan test --compact tests/Integration/OnlyOfficeDocumentServerTest.php

      - name: Show ONLYOFFICE Logs
        if: failure()
        run: docker logs "${{ job.services.onlyoffice.id }}"
