name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Test Migrations
        env:
          DB_DATABASE: ${{ runner.temp }}/migration-test.sqlite
        run: |
          touch "$DB_DATABASE"
          php artisan migrate:fresh --force
          php artisan migrate:reset --force
          php artisan migrate --force

      - name: Build Assets
        run: npm run build

      - name: Run Type Analysis
        run: composer types:check

      - name: Tests
        run: php artisan test

  postgresql:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: jin_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    services:
      postgres:
        image: groonga/pgroonga:4.0.6-alpine-17@sha256:71665e330db82bb162a021c34d9ccf4bc933505bd78c65f8770eddbeaee8b3ab
        env:
          POSTGRES_DB: jin_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Configure Application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Fresh PostgreSQL Migrations
        run: php artisan migrate:fresh --force

      - name: Run PostgreSQL Tests
        run: php artisan test --compact

  file-content-extractors:
    needs: ci
    runs-on: ubuntu-latest
    env:
      STORED_FILE_CONTENT_INTEGRATION: 'true'
      STORED_FILE_CONTENT_MARKITDOWN_PATH: ${{ github.workspace }}/.venv-file-content/bin/markitdown

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, zip
          tools: composer:v2
          coverage: none

      - name: Install Extractor Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv
          python3 -m venv .venv-file-content
          .venv-file-content/bin/python -m pip install \
            --disable-pip-version-check \
            --requirement requirements-file-content.txt

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Configure Application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Real Extractor Tests
        run: php artisan test --compact tests/Integration/StoredFileContentExtractorTest.php

  onlyoffice:
    needs: ci
    runs-on: ubuntu-latest
    env:
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/onlyoffice-ci.sqlite
      IP_RESTRICTION_ENABLED: 'false'
      ONLYOFFICE_ENABLED: 'true'
      ONLYOFFICE_DOCUMENT_SERVER_URL: http://127.0.0.1:8081
      ONLYOFFICE_PUBLIC_URL: http://127.0.0.1:8081
      ONLYOFFICE_JWT_SECRET: ci-onlyoffice-secret-not-for-production
      ONLYOFFICE_INSTANCE_ID: jin-ci
    services:
      onlyoffice:
        image: onlyoffice/documentserver:9.4.0.1
        env:
          JWT_ENABLED: 'true'
          JWT_SECRET: ci-onlyoffice-secret-not-for-production
          # CI only: DocumentServer must fetch Jin through the isolated Docker bridge.
          ALLOW_PRIVATE_IP_ADDRESS: 'true'
          ALLOW_META_IP_ADDRESS: 'false'
          PLUGINS_ENABLED: 'false'
        ports:
          - 8081:80
        options: --shm-size=2g

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, sqlite3, zip
          tools: composer:v2
          coverage: none

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Configure Application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch "$DB_DATABASE"
          php artisan migrate --force

      - name: Wait for ONLYOFFICE
        run: |
          for attempt in {1..120}; do
            if curl -fsS --connect-timeout 2 --max-time 3 \
              http://127.0.0.1:8081/healthcheck 2>/dev/null |
              tr -d '[:space:]' |
              grep -Eiq '^(true|ok)$' &&
              curl -fsS --connect-timeout 2 --max-time 10 \
                http://127.0.0.1:8081/web-apps/apps/api/documents/api.js >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo 'ONLYOFFICE did not become ready within 240 seconds.' >&2
          exit 1

      - name: Run ONLYOFFICE DocumentServer Test
        env:
          ONLYOFFICE_E2E: 'true'
        run: |
          onlyoffice_network="$(docker inspect '${{ job.services.onlyoffice.id }}' \
            --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}')"
          app_gateway="$(docker network inspect "$onlyoffice_network" \
            --format '{{(index .IPAM.Config 0).Gateway}}')"
          export APP_ONLYOFFICE_INTERNAL_URL="http://${app_gateway}:8000"

          php artisan serve --host=0.0.0.0 --port=8000 \
            >storage/logs/onlyoffice-ci-app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS --connect-timeout 2 --max-time 3 \
              http://127.0.0.1:8000/up >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat storage/logs/onlyoffice-ci-app.log
              exit 1
            fi
            sleep 1
          done

          docker exec '${{ job.services.onlyoffice.id }}' \
            curl -fsS --connect-timeout 2 --max-time 5 \
            "${APP_ONLYOFFICE_INTERNAL_URL}/up" >/dev/null

          php artisan test --compact tests/E2E/OnlyOfficeDocumentServerTest.php

      - name: Show ONLYOFFICE Logs
        if: failure()
        run: |
          test ! -f storage/logs/onlyoffice-ci-app.log || cat storage/logs/onlyoffice-ci-app.log
          docker logs "${{ job.services.onlyoffice.id }}"
